name: Gemini AI Comment Responder

on:
  issue_comment:
    types: [created]

jobs:
  respond:
    # This job will now run for comments on both issues and pull requests,
    # as long as the comment is not from the bot itself.
    if: github.event.comment.author.login != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @actions/github @google/generative-ai @octokit/core

      - name: Run Gemini Responder Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .github/scripts/review.js
