name: Deploy

on:
  workflow_dispatch:  # Manual trigger only for testing

permissions:
  id-token: write  # For future OIDC enhancement
  contents: read

jobs:
  test-cf-login:
    runs-on: ubuntu-latest
    environment: dev  # Using the "dev" environment you created
    
    steps:
      - name: Install Cloud Foundry CLI
        run: |
          echo "📦 Installing Cloud Foundry CLI..."
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key \
          | sudo tee /etc/apt/trusted.gpg.d/cloudfoundry.asc
          echo "deb https://packages.cloudfoundry.org/debian stable main" \
          | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt update
          sudo apt install cf8-cli
          
          echo "✅ CF CLI installed successfully"
          cf version
      
      - name: Test CF Login with Environment Secrets
        run: |
          echo "🔐 Attempting to login to Cloud Foundry using environment secrets..."
          echo ""
          
          # Attempt login (secrets are automatically masked in logs)
          cf login -a ${{ secrets.CF_API }} \
            -u ${{ secrets.CF_USER }} \
            -p ${{ secrets.CF_PASSWORD }} \
            -o ${{ secrets.CF_ORG }} \
            -s ${{ secrets.CF_SPACE }}
          
          echo ""
          echo "✅ Login successful! Environment secrets are working correctly."
          echo ""
      
      - name: Verify CF Target
        run: |
          echo "🎯 Verifying current Cloud Foundry target..."
          cf target
          echo ""
          echo "✅ Target verified successfully!"
      
      - name: List Apps (Optional Verification)
        run: |
          echo "📋 Listing deployed applications in current space..."
          cf apps
          echo ""
          echo "✅ Test completed successfully! Environment secrets are working."
        continue-on-error: true  # Don't fail if no apps exist
      
      - name: Logout
        if: always()
        run: |
          echo "🚪 Logging out from Cloud Foundry..."
          cf logout
          echo "✅ Logged out successfully"
