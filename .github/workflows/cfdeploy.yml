name: Deploy

on:
  workflow_dispatch:
    inputs:
      cfspace:
        description: 'The Cloud Foundry space to deploy to'
        required: true
        default: 'yash'
      sdm_branch:
        description: 'Branch name for sdm.git repository'
        required: true
        default: 'cfdeploy_job'
      incidents_app_branch:
        description: 'Branch name for incidents-app.git repository'
        required: true
        default: 'local_deploy'
      applicationVersion:
        description: 'Version for the application deployment (updates manifest.json)'
        required: true
        default: '0.0.9'
      REPOSITORY_ID:
        description: 'ID of the repository for tracking/metadata (updates mta.yaml)'
        required: true
        default: '7b9b33a9-0606-4caf-bb61-1d810de9a6b2'

permissions:
  pull-requests: read

jobs:
  Deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Login to Cloud Foundry
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key \
          | sudo tee /etc/apt/trusted.gpg.d/cloudfoundry.asc
          echo "deb https://packages.cloudfoundry.org/debian stable main" \
          | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt update
          sudo apt install cf-cli
          cf login -a ${{ secrets.CF_API }} -u ${{ secrets.CF_USER }} -p ${{ secrets.CF_PASSWORD }} -o ${{ secrets.CF_ORG }} -s ${{ github.event.inputs.cfspace }}

      - name: Clone and prepare projects & Update manifest/mta files
        run: |
          # --- Clone sdm and incidents-app repositories ---
          git clone --single-branch --branch ${{ github.event.inputs.sdm_branch }} https://github.com/cap-js/sdm.git
          git clone --single-branch --branch ${{ github.event.inputs.incidents_app_branch }} https://github.com/cap-js/incidents-app.git

          # --- Move sdm package into incidents-app ---
          cd sdm
          npm pack
          echo "Current directory (sdm): $(pwd)"
          ls -l
          mv *.tgz ../incidents-app

          # --- Navigate to incidents-app root ---
          cd ../incidents-app
          echo "Current directory (incidents-app): $(pwd)"

          # --- Install jq (for manifest.json) and yq (for mta.yaml) ---
          sudo apt-get update
          sudo apt-get install -y jq # For manifest.json
          # Install yq (Go version)
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod a+x /usr/local/bin/yq # Corrected 'a%x' to 'a+x'
          echo "yq version: $(yq --version)"


          # --- Update applicationVersion in app/incidents/webapp/manifest.json ---
          MANIFEST_FILE="app/incidents/webapp/manifest.json"
          NEW_APP_VERSION="${{ github.event.inputs.applicationVersion }}"

          echo "DEBUG: Input applicationVersion value for manifest: '$NEW_APP_VERSION'" # Added debug line

          if [ -f "$MANIFEST_FILE" ]; then
            echo "--- Full manifest.json content BEFORE update ---" # Debug output
            cat "$MANIFEST_FILE" # Debug output

            echo "--- Original manifest.json applicationVersion (before update) ---"
            jq '."sap.app".applicationVersion.version' "$MANIFEST_FILE" || echo "Path not found in manifest or file empty."
            
            # --- CRITICAL FIX HERE: Use --arg to pass NEW_APP_VERSION to jq ---
            jq --arg new_version "$NEW_APP_VERSION" '."sap.app".applicationVersion.version = $new_version' "$MANIFEST_FILE" > "${MANIFEST_FILE}.tmp" && \
            mv "${MANIFEST_FILE}.tmp" "$MANIFEST_FILE"
            
            echo "--- Updated manifest.json applicationVersion ---"
            jq '."sap.app".applicationVersion.version' "$MANIFEST_FILE"
            echo "--- Full manifest.json content AFTER update ---" # Debug output
            cat "$MANIFEST_FILE" # Debug output
            echo "Successfully updated applicationVersion in $MANIFEST_FILE to $NEW_APP_VERSION"
          else
            echo "Error: manifest.json not found at $MANIFEST_FILE. Cannot update applicationVersion."
            exit 1
          fi

          # --- Update REPOSITORY_ID in mta.yaml ---
          MTA_FILE="mta.yaml"
          NEW_REPO_ID="${{ github.event.inputs.REPOSITORY_ID }}"
          
          # IMPORTANT: Adjust this path '.parameters.REPOSITORY_ID' if your REPOSITORY_ID is elsewhere in mta.yaml
          MTA_PATH_TO_UPDATE=".parameters.REPOSITORY_ID" 

          if [ -f "$MTA_FILE" ]; then
            echo "--- Original mta.yaml REPOSITORY_ID (before update) ---"
            yq e "$MTA_PATH_TO_UPDATE" "$MTA_FILE" || echo "Path not found in mta.yaml or file empty."

            yq -i e "$MTA_PATH_TO_UPDATE = \"$NEW_REPO_ID\"" "$MTA_FILE"
            
            echo "--- Updated mta.yaml REPOSITORY_ID ---"
            yq e "$MTA_PATH_TO_UPDATE" "$MTA_FILE"
            echo "--- Full mta.yaml content AFTER update ---" # Debug output
            cat "$MTA_FILE" # Debug output
            echo "Successfully updated REPOSITORY_ID in $MTA_FILE to $NEW_REPO_ID"
          else
            echo "Error: mta.yaml not found at $MTA_FILE. Cannot update REPOSITORY_ID."
            exit 1
          fi

          # --- Install npm dependencies for incidents-app, including the sdm package ---
          npm i *.tgz

