name: Single Tenant Integration Test

on:
  workflow_dispatch:
    inputs:
      cf_space:
        description: 'Specify the Cloud Foundry space to run integration tests on'
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: dev
    env:
      CF_API: ${{ secrets.CF_API }}
      CF_USER: ${{ secrets.CF_USER }}
      CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
      CF_ORG: ${{ secrets.CF_ORG }}
      CF_SPACE: ${{ secrets.CF_SPACE }}
      CAPAUTH_URL: ${{ secrets.CAPAUTH_URL }}
      NOSDMROLEUSERNAME: ${{ secrets.NOSDMROLEUSERNAME }}
      NOSDMROLEUSERPASSWORD: ${{ secrets.NOSDMROLEUSERPASSWORD }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cloud Foundry CLI and jq
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install -y cf8-cli jq

      - name: Determine Cloud Foundry Space
        id: determine_space
        run: |
          if [ "${{ github.event.inputs.cf_space }}" == "developcap" ]; then
            space="$CF_SPACE"
          else
            space="${{ github.event.inputs.cf_space }}"
          fi
          echo "space=$space" >> "$GITHUB_ENV"

      - name: Login to Cloud Foundry
        run: |
          # Do not log space name or org to avoid unintended exposure
          cf login -a "$CF_API" \
            -u "$CF_USER" \
            -p "$CF_PASSWORD" \
            -o "$CF_ORG" \
            -s "${{ env.space }}"

      - name: Fetch and Mask Client Secret and ID
        id: fetch_secret
        run: |
          MAX_RETRIES=3
          RETRY_DELAY=10
          for attempt in $(seq 1 $MAX_RETRIES); do
            service_instance_guid=$(cf service sdm-incidents-auth --guid 2>/dev/null || echo "")
            if [ -n "$service_instance_guid" ]; then
              break
            fi
            if [ $attempt -lt $MAX_RETRIES ]; then
              echo "Attempt $attempt failed, retrying in ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
              RETRY_DELAY=$((RETRY_DELAY * 2))
            fi
          done
          if [ -z "$service_instance_guid" ]; then
            echo "Error: Unable to retrieve service instance GUID after $MAX_RETRIES attempts"; exit 1;
          fi
          bindings_response=$(cf curl "/v3/service_credential_bindings?service_instance_guids=${service_instance_guid}")
          binding_guid=$(echo "$bindings_response" | jq -r '.resources[0].guid')
          if [ -z "$binding_guid" ] || [ "$binding_guid" = "null" ]; then
            echo "Error: Unable to retrieve binding GUID"; exit 1;
          fi
          binding_details=$(cf curl "/v3/service_credential_bindings/${binding_guid}/details")
          clientSecret=$(echo "$binding_details" | jq -r '.credentials.clientsecret')
          if [ -z "$clientSecret" ] || [ "$clientSecret" = "null" ]; then
            echo "Error: clientSecret is not set or is null"; exit 1;
          fi
          escapedClientSecret=$(echo "$clientSecret" | sed 's/\$/\\$/g')
          clientID=$(echo "$binding_details" | jq -r '.credentials.clientid')
          if [ -z "$clientID" ] || [ "$clientID" = "null" ]; then
            echo "Error: clientID is not set or is null"; exit 1;
          fi
          # Mask both raw and escaped forms — they differ if the secret contains '$',
          # and GitHub only masks exact string matches
          echo "::add-mask::${clientSecret}"
          echo "::add-mask::${escapedClientSecret}"
          echo "::add-mask::${clientID}"
          echo "CLIENT_SECRET=${escapedClientSecret}" >> "$GITHUB_ENV"
          echo "CLIENT_ID=${clientID}" >> "$GITHUB_ENV"
          # Fetch SDM CMIS credentials from the 'sdm' service binding for incidents-srv
          cmis_service_guid=$(cf service sdm --guid)
          if [ -z "$cmis_service_guid" ]; then
            echo "Error: Unable to retrieve SDM service instance GUID"; exit 1;
          fi
          cmis_bindings_response=$(cf curl "/v3/service_credential_bindings?service_instance_guids=${cmis_service_guid}")
          incidents_app_guid=$(cf app incidents-srv --guid)
          cmis_binding_guid=$(echo "$cmis_bindings_response" | jq -r \
            --arg app_guid "$incidents_app_guid" \
            '.resources[] | select(.relationships.app.data.guid == $app_guid) | .guid' | head -1)
          if [ -z "$cmis_binding_guid" ] || [ "$cmis_binding_guid" = "null" ]; then
            echo "Error: Unable to retrieve SDM binding GUID for incidents-srv"; exit 1;
          fi
          cmis_binding_details=$(cf curl "/v3/service_credential_bindings/${cmis_binding_guid}/details")
          cmis_client_secret=$(echo "$cmis_binding_details" | jq -r '.credentials.uaa.clientsecret // .credentials.clientsecret // empty')
          if [ -z "$cmis_client_secret" ] || [ "$cmis_client_secret" = "null" ]; then
            echo "Error: SDM clientsecret is not set or is null"; exit 1;
          fi
          echo "::add-mask::${cmis_client_secret}"
          cmis_client_id=$(echo "$cmis_binding_details" | jq -r '.credentials.uaa.clientid // .credentials.clientid // empty')
          if [ -z "$cmis_client_id" ] || [ "$cmis_client_id" = "null" ]; then
            echo "Error: SDM clientid is not set or is null"; exit 1;
          fi
          echo "::add-mask::${cmis_client_id}"
          cmis_url=$(echo "$cmis_binding_details" | jq -r '.credentials.uri // .credentials.endpoints.ecm_service // .credentials.url // empty')
          if [ -z "$cmis_url" ] || [ "$cmis_url" = "null" ]; then
            echo "Error: SDM CMIS URL not found in binding details"; exit 1;
          fi
          echo "::add-mask::${cmis_url}"
          escaped_cmis_client_secret=$(echo "$cmis_client_secret" | sed 's/\$/\\$/g')
          escaped_cmis_url=$(echo "$cmis_url" | sed 's/\$/\\$/g')
          printf 'CMIS_CLIENT_SECRET=%s\n' "$escaped_cmis_client_secret" >> "$GITHUB_ENV"
          printf 'CMIS_CLIENT_ID=%s\n' "$cmis_client_id" >> "$GITHUB_ENV"
          printf 'CMIS_URL=%s\n' "$escaped_cmis_url" >> "$GITHUB_ENV"

      - name: Run integration tests
        run: |
          set -e
          JSON_FILE="test/integration/credentials.json"
          trap 'rm -f "$JSON_FILE"' EXIT

          appUrl="$CF_ORG-${{ env.space }}-incidents-srv.cfapps.eu12.hana.ondemand.com"

          (
            set +x
            jq \
              --arg appUrl "$appUrl" \
              --arg authUrl "${{ secrets.CAPAUTH_URL }}" \
              --arg clientID "${{ env.CLIENT_ID }}" \
              --arg clientSecret "${{ env.CLIENT_SECRET }}" \
              --arg username "${{ secrets.CF_USER }}" \
              --arg password "${{ secrets.CF_PASSWORD }}" \
              --arg noSDMRoleUsername "${{ secrets.NOSDMROLEUSERNAME }}" \
              --arg noSDMRoleUserPassword "${{ secrets.NOSDMROLEUSERPASSWORD }}" \
              --arg virusScanRepositoryID "${{ secrets.VIRUSSCANREPOSITORYID }}" \
              --arg defaultRepositoryID "${{ secrets.DEFAULTREPOSITORYID }}" \
              --arg CMIS_URL "${{ env.CMIS_URL }}" \
              --arg cmisClientID "${{ env.CMIS_CLIENT_ID }}" \
              --arg cmisClientSecret "${{ env.CMIS_CLIENT_SECRET }}" \
              --arg APP_NAME "incidents-srv" \
              --arg MT_APP_NAME "incidents-mtx-srv" \
              '
                .appUrl = $appUrl
               | .authUrl = $authUrl
               | .clientID = $clientID
               | .clientSecret = $clientSecret
               | .username = $username
               | .password = $password
               | .noSDMRoleUsername = $noSDMRoleUsername
               | .noSDMRoleUserPassword = $noSDMRoleUserPassword
               | .virusScanRepositoryID = $virusScanRepositoryID
               | .defaultRepositoryID = $defaultRepositoryID
               | .CMIS_URL = $CMIS_URL
               | .cmisClientID = $cmisClientID
               | .cmisClientSecret = $cmisClientSecret
               | .APP_NAME = $APP_NAME
               | .MT_APP_NAME = $MT_APP_NAME
              ' "$JSON_FILE" > "temp.json"
          )
          mv "temp.json" "$JSON_FILE"

          # Print only non-sensitive fields — never print credential fields
          echo "Generated credentials.json:"
          jq '{ appUrl, authUrl }' "$JSON_FILE"

          npm install

          echo ""
          echo "Running Single-Tenant Draft-enabled Entity(Books) Integration Tests..."
          TENANCY_MODEL=single npm run integration-test

          echo ""
          echo "Running Single-Tenant Non-draft Entity(Projects) Integration Tests..."
          TENANCY_MODEL=single npm run integration-test-non-draft

  versioned-repo-setup:
    runs-on: ubuntu-latest
    needs: integration-test
    steps:
      - name: Install Cloud Foundry CLI
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install -y cf8-cli

      - name: Determine Cloud Foundry Space
        run: |
          if [ "${{ github.event.inputs.cf_space }}" == "developcap" ]; then
            space="${{ secrets.CF_SPACE }}"
          else
            space="${{ github.event.inputs.cf_space }}"
          fi
          echo "space=$space" >> "$GITHUB_ENV"

      - name: Login and Switch to Versioned Repository
        run: |
          cf login -a "${{ secrets.CF_API }}" -u "${{ secrets.CF_USER }}" -p "${{ secrets.CF_PASSWORD }}" -o "${{ secrets.CF_ORG }}" -s "${{ env.space }}"
          cf set-env incidents-srv REPOSITORY_ID "${{ secrets.VERSIONEDREPOSITORYID }}"
          cf restage incidents-srv > /dev/null 2>&1

  versioned-integration-test:
    runs-on: ubuntu-latest
    needs: versioned-repo-setup
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
