name: Multi Tenancy Integration Test

on:
  workflow_dispatch:
    inputs:
      cf_space:
        description: 'Specify the Cloud Foundry space to run integration tests on'
        required: true
        default: developcap

      branch_name:
        description: 'Specify the branch to use for integration tests'
        required: true
        default: develop

permissions:
  contents: read

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: dev
    env:
      CF_API: ${{ secrets.CF_API }}
      CF_USER: ${{ secrets.CF_USER }}
      CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
      CF_ORG: ${{ secrets.CF_ORG }}
      CF_SPACE: ${{ secrets.CF_SPACE }}
      NOSDMROLEUSERNAME: ${{ secrets.NOSDMROLEUSERNAME }}
      NOSDMROLEUSERPASSWORD: ${{ secrets.NOSDMROLEUSERPASSWORD }}
      AUTHURLMT1: ${{ secrets.AUTHURLMT1 }}
      AUTHURLMT2: ${{ secrets.AUTHURLMT2 }}

    steps:
      - name: Checkout repository ✅
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch_name }}

      - name: Setup Node.js environment ⚙️
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install Cloud Foundry CLI and jq
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install -y cf8-cli jq

      - name: Determine Cloud Foundry Space
        id: determine_space
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            space="$CF_SPACE"
          elif [ "${{ github.event.inputs.cf_space }}" == "developcap" ]; then
            space="$CF_SPACE"
          else
            space="${{ github.event.inputs.cf_space }}"
          fi
          echo "space=$space" >> "$GITHUB_ENV"

      - name: Login to Cloud Foundry
        run: |
          echo "🔄 Logging in to Cloud Foundry..."
          cf login -a "$CF_API" \
            -u "$CF_USER" \
            -p "$CF_PASSWORD" \
            -o "$CF_ORG" \
            -s "${{ env.space }}"

      - name: Fetch Multi Tenant Credentials 🔍
        id: fetch_credentials_mt
        run: |
          echo "Fetching client details for multi tenant..."
          service_instance_guid_mt=$(cf service incidents-mtx-auth --guid 2>/dev/null || echo "")

          if [ -z "$service_instance_guid_mt" ]; then
            echo "Warning: incidents-mtx-auth service not found, trying alternative service names..."
            service_instance_guid_mt=$(cf service sdm-incidents-mtx-auth --guid 2>/dev/null || echo "")
          fi

          if [ -z "$service_instance_guid_mt" ]; then
            echo "Error: Unable to retrieve multitenant service instance GUID"; exit 1;
          fi

          bindings_response_mt=$(cf curl "/v3/service_credential_bindings?service_instance_guids=${service_instance_guid_mt}")
          binding_guid_mt=$(echo "$bindings_response_mt" | jq -r '.resources[0].guid')

          if [ -z "$binding_guid_mt" ] || [ "$binding_guid_mt" == "null" ]; then
            echo "Error: Unable to retrieve multitenant binding GUID"; exit 1;
          fi

          binding_details_mt=$(cf curl "/v3/service_credential_bindings/${binding_guid_mt}/details")

          clientSecretMT=$(echo "$binding_details_mt" | jq -r '.credentials.clientsecret')
          clientIDMT=$(echo "$binding_details_mt" | jq -r '.credentials.clientid')

          if [ -z "$clientSecretMT" ] || [ "$clientSecretMT" == "null" ] || [ -z "$clientIDMT" ] || [ "$clientIDMT" == "null" ]; then
            echo "Error: Invalid MT credentials from service"; exit 1;
          fi

          escapedClientSecretMT=$(echo "$clientSecretMT" | sed 's/\$/\\$/g')
          # Mask both raw and escaped forms — they differ if the secret contains '$',
          # and GitHub only masks exact string matches
          echo "::add-mask::${clientSecretMT}"
          echo "::add-mask::${escapedClientSecretMT}"
          echo "::add-mask::${clientIDMT}"
          echo "CLIENT_SECRET_MT=${escapedClientSecretMT}" >> "$GITHUB_ENV"
          echo "CLIENT_ID_MT=${clientIDMT}" >> "$GITHUB_ENV"

          # Fetch SDM CMIS credentials from the 'incidents-mtx-sdm' service binding for incidents-mtx-srv
          cmis_service_guid_mt=$(cf service incidents-mtx-sdm --guid)
          if [ -z "$cmis_service_guid_mt" ]; then
            echo "Error: Unable to retrieve incidents-mtx-sdm service instance GUID"; exit 1;
          fi
          cmis_bindings_response_mt=$(cf curl "/v3/service_credential_bindings?service_instance_guids=${cmis_service_guid_mt}")
          mtx_app_guid=$(cf app incidents-mtx-srv --guid)
          cmis_binding_guid_mt=$(echo "$cmis_bindings_response_mt" | jq -r \
            --arg app_guid "$mtx_app_guid" \
            '.resources[] | select(.relationships.app.data.guid == $app_guid) | .guid' | head -1)
          if [ -z "$cmis_binding_guid_mt" ] || [ "$cmis_binding_guid_mt" = "null" ]; then
            echo "Error: Unable to retrieve incidents-mtx-sdm binding GUID for incidents-mtx-srv"; exit 1;
          fi
          cmis_binding_details_mt=$(cf curl "/v3/service_credential_bindings/${cmis_binding_guid_mt}/details")
          cmis_client_secret_mt=$(echo "$cmis_binding_details_mt" | jq -r '.credentials.uaa.clientsecret // .credentials.clientsecret // empty')
          if [ -z "$cmis_client_secret_mt" ] || [ "$cmis_client_secret_mt" = "null" ]; then
            echo "Error: incidents-mtx-sdm clientsecret is not set or is null"; exit 1;
          fi
          echo "::add-mask::${cmis_client_secret_mt}"
          cmis_client_id_mt=$(echo "$cmis_binding_details_mt" | jq -r '.credentials.uaa.clientid // .credentials.clientid // empty')
          if [ -z "$cmis_client_id_mt" ] || [ "$cmis_client_id_mt" = "null" ]; then
            echo "Error: incidents-mtx-sdm clientid is not set or is null"; exit 1;
          fi
          echo "::add-mask::${cmis_client_id_mt}"
          cmis_url_mt=$(echo "$cmis_binding_details_mt" | jq -r '.credentials.uri // .credentials.endpoints.ecm_service // .credentials.url // empty')
          if [ -z "$cmis_url_mt" ] || [ "$cmis_url_mt" = "null" ]; then
            echo "Error: incidents-mtx-sdm CMIS URL not found in binding details"; exit 1;
          fi
          echo "::add-mask::${cmis_url_mt}"
          escaped_cmis_client_secret_mt=$(echo "$cmis_client_secret_mt" | sed 's/\$/\\$/g')
          escaped_cmis_url_mt=$(echo "$cmis_url_mt" | sed 's/\$/\\$/g')
          printf 'CMIS_CLIENT_SECRET_MT=%s\n' "$escaped_cmis_client_secret_mt" >> "$GITHUB_ENV"
          printf 'CMIS_CLIENT_ID_MT=%s\n' "$cmis_client_id_mt" >> "$GITHUB_ENV"
          printf 'CMIS_URL=%s\n' "$escaped_cmis_url_mt" >> "$GITHUB_ENV"
          echo "✅ Multi-tenant client details fetched successfully!"

      - name: Run Integration Tests 🎯
        run: |
          set -e
          JSON_FILE="test/integration/credentials.json"
          trap 'rm -f "$JSON_FILE"' EXIT

          echo "🚀 Starting multi-tenant integration tests..."

          appUrlMT="$CF_ORG-${{ env.space }}-incidents-mtx-srv.cfapps.eu12.hana.ondemand.com"

          (
            set +x
            jq \
              --arg appUrlMT "$appUrlMT" \
              --arg authUrlMTSDC "${{ secrets.AUTHURLMT1 }}" \
              --arg authUrlMTGWC "${{ secrets.AUTHURLMT2 }}" \
              --arg clientIDMT "${{ env.CLIENT_ID_MT }}" \
              --arg clientSecretMT "${{ env.CLIENT_SECRET_MT }}" \
              --arg username "${{ secrets.CF_USER }}" \
              --arg password "${{ secrets.CF_PASSWORD }}" \
              --arg noSDMRoleUsername "${{ secrets.NOSDMROLEUSERNAME }}" \
              --arg noSDMRoleUserPassword "${{ secrets.NOSDMROLEUSERPASSWORD }}" \
              --arg defaultRepositoryIDMT "${{ secrets.DEFAULTREPOSITORYIDMT }}" \
              --arg virusScanRepositoryID "${{ secrets.VIRUSSCANREPOSITORYID }}" \
              --arg defaultRepositoryID "${{ secrets.DEFAULTREPOSITORYID }}" \
              --arg CMIS_URL "${{ env.CMIS_URL }}" \
              --arg cmisClientIDMT "${{ env.CMIS_CLIENT_ID_MT }}" \
              --arg cmisClientSecretMT "${{ env.CMIS_CLIENT_SECRET_MT }}" \
              --arg APP_NAME "incidents-srv" \
              --arg MT_APP_NAME "incidents-mtx-srv" \
              '
                .appUrlMT = $appUrlMT
               | .authUrlMTSDC = $authUrlMTSDC
               | .authUrlMTGWC = $authUrlMTGWC
               | .clientIDMT = $clientIDMT
               | .clientSecretMT = $clientSecretMT
               | .username = $username
               | .password = $password
               | .noSDMRoleUsername = $noSDMRoleUsername
               | .noSDMRoleUserPassword = $noSDMRoleUserPassword
               | .defaultRepositoryIDMT = $defaultRepositoryIDMT
               | .virusScanRepositoryID = $virusScanRepositoryID
               | .defaultRepositoryID = $defaultRepositoryID
               | .CMIS_URL = $CMIS_URL
               | .cmisClientIDMT = $cmisClientIDMT
               | .cmisClientSecretMT = $cmisClientSecretMT
               | .APP_NAME = $APP_NAME
               | .MT_APP_NAME = $MT_APP_NAME
              ' "$JSON_FILE" > "temp.json"
          )
          mv "temp.json" "$JSON_FILE"

          # Print only non-sensitive fields — never print credential fields
          echo "Generated credentials.json (with masked secrets):"
          jq '{ appUrlMT }' "$JSON_FILE"

          npm install

          echo ""
          echo "Running Multi-Tenant Draft-enabled Entity(Books) Integration Tests (Tenant 1)..."
          TENANCY_MODEL=multi TENANT=SDM-DEV-CONSUMER-EU12 npm run integration-test

          echo ""
          echo "Running Multi-Tenant Non-draft Entity(Projects) Integration Tests (Tenant 1)..."
          TENANCY_MODEL=multi TENANT=SDM-DEV-CONSUMER-EU12 npm run integration-test-non-draft

          echo ""
          echo "Running Multi-Tenant Draft-enabled Entity(Books) Integration Tests (Tenant 2)..."
          TENANCY_MODEL=multi TENANT=SDMGoogleWorkspaceConsumer npm run integration-test

          echo ""
          echo "Running Multi-Tenant Non-draft Entity(Projects) Integration Tests (Tenant 2)..."
          TENANCY_MODEL=multi TENANT=SDMGoogleWorkspaceConsumer npm run integration-test-non-draft

  versioned-repo-setup:
    runs-on: ubuntu-latest
    environment: dev
    needs: integration-test
    steps:
      - name: Install Cloud Foundry CLI
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install -y cf8-cli

      - name: Determine Cloud Foundry Space
        run: |
          if [ "${{ github.event.inputs.cf_space }}" == "developcap" ]; then
            space="${{ secrets.CF_SPACE }}"
          else
            space="${{ github.event.inputs.cf_space }}"
          fi
          echo "space=$space" >> "$GITHUB_ENV"

      - name: Login and Switch to Versioned Repository
        run: |
          cf login -a "${{ secrets.CF_API }}" -u "${{ secrets.CF_USER }}" -p "${{ secrets.CF_PASSWORD }}" -o "${{ secrets.CF_ORG }}" -s "${{ env.space }}"
          cf set-env incidents-mtx-srv REPOSITORY_ID "${{ secrets.VERSIONEDREPOSITORYID }}"
          cf restage incidents-mtx-srv > /dev/null 2>&1

  versioned-integration-test:
