name: Multi Tenancy Integration Test 🚀

on:
  workflow_dispatch:
    inputs:
      cf_space:
        description: 'Specify the Cloud Foundry space to run integration tests on'
        required: true
        default: developcap

      branch_name:
        description: 'Specify the branch to use for integration tests'
        required: true
        default: develop

permissions:
  contents: read

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: dev
    env:
      CF_API: ${{ secrets.CF_API }}
      CF_USER: ${{ secrets.CF_USER }}
      CF_PASSWORD: ${{ secrets.CF_PASSWORD }}
      CF_ORG: ${{ secrets.CF_ORG }}
      CF_SPACE: ${{ secrets.CF_SPACE }}
      NOSDMROLEUSERNAME: ${{ secrets.NOSDMROLEUSERNAME }}
      NOSDMROLEUSERPASSWORD: ${{ secrets.NOSDMROLEUSERPASSWORD }}
      AUTHURLMT1: ${{ secrets.AUTHURLMT1 }}
      AUTHURLMT2: ${{ secrets.AUTHURLMT2 }}

    steps:
      - name: Checkout repository ✅
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch_name }}

      - name: Setup Node.js environment ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cloud Foundry CLI and jq 📦
        run: |
          echo "🔧 Installing Cloud Foundry CLI and jq..."
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install cf8-cli jq
      - name: Determine Cloud Foundry Space 🌌
        id: determine_space
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            space="$CF_SPACE"
          elif [ "${{ github.event.inputs.cf_space }}" == "developcap" ]; then
            space="$CF_SPACE"
          else
            space="${{ github.event.inputs.cf_space }}"
          fi
          echo "🌍 Space determined for use"
          echo "space=$space" >> $GITHUB_ENV
      - name: Login to Cloud Foundry 🔑
        run: |
          echo "🔄 Logging in to Cloud Foundry..."
          cf login -a "$CF_API" \
            -u "$CF_USER" \
            -p "$CF_PASSWORD" \
            -o "$CF_ORG" \
            -s "${{ env.space }}"
      - name: Fetch Multi Tenant Credentials 🔍
        id: fetch_credentials_mt
        run: |
          echo "Fetching client details for multi tenant..."
          service_instance_guid_mt=$(cf service incidents-mtx-auth --guid 2>/dev/null || echo "")
          
          if [ -z "$service_instance_guid_mt" ]; then
            echo "Warning: incidents-mtx-auth service not found, trying alternative service names..."
            service_instance_guid_mt=$(cf service sdm-incidents-mtx-auth --guid 2>/dev/null || echo "")
          fi
          
          if [ -z "$service_instance_guid_mt" ]; then
            echo "❌ Error: Unable to retrieve multitenant service instance GUID"; exit 1;
          fi
          
          bindings_response_mt=$(cf curl "/v3/service_credential_bindings?service_instance_guids=${service_instance_guid_mt}")
          binding_guid_mt=$(echo $bindings_response_mt | jq -r '.resources[0].guid')
          
          if [ -z "$binding_guid_mt" ] || [ "$binding_guid_mt" == "null" ]; then
            echo "❌ Error: Unable to retrieve multitenant binding GUID"; exit 1;
          fi
          
          binding_details_mt=$(cf curl "/v3/service_credential_bindings/${binding_guid_mt}/details")
          
          clientSecretMT=$(echo "$binding_details_mt" | jq -r '.credentials.clientsecret')
          clientIDMT=$(echo "$binding_details_mt" | jq -r '.credentials.clientid')
          
          if [ -z "$clientSecretMT" ] || [ "$clientSecretMT" == "null" ] || [ -z "$clientIDMT" ] || [ "$clientIDMT" == "null" ]; then
            echo "❌ Error: Invalid MT credentials from service"; exit 1;
          fi
          
          escapedClientSecretMT=$(echo "$clientSecretMT" | sed 's/\$/\\$/g')
          # Mask before writing to GITHUB_ENV — mask both raw and escaped forms
          # (they differ if the secret contains '$', GitHub only masks exact string matches)
          echo "::add-mask::${clientSecretMT}"
          echo "::add-mask::${escapedClientSecretMT}"
          echo "::add-mask::${clientIDMT}"
          echo "CLIENT_SECRET_MT=${escapedClientSecretMT}" >> $GITHUB_ENV
          echo "CLIENT_ID_MT=${clientIDMT}" >> $GITHUB_ENV
          echo "✅ Multi-tenant client details fetched successfully!"
      - name: Run Integration Tests 🎯
        run: |
          JSON_FILE="test/integration/credentials.json"
          trap 'rm -f "$JSON_FILE"' EXIT

          echo "🚀 Starting multi-tenant integration tests..."
          
          appUrlMT="$CF_ORG-${{ env.space }}-incidents-mtx-srv.cfapps.eu12.hana.ondemand.com"

          (
            set +x
            jq -n \
              --arg username "$CF_USER" \
              --arg password "$CF_PASSWORD" \
              --arg noSDMRoleUsername "$NOSDMROLEUSERNAME" \
              --arg noSDMRoleUserPassword "$NOSDMROLEUSERPASSWORD" \
              --arg clientIDMT "${{ env.CLIENT_ID_MT }}" \
              --arg clientSecretMT "${{ env.CLIENT_SECRET_MT }}" \
              --arg appUrlMT "$appUrlMT" \
              --arg authUrlMTSDC "$AUTHURLMT1" \
              --arg authUrlMTGWC "$AUTHURLMT2" \
              '{
                username: $username,
                password: $password,
                noSDMRoleUsername: $noSDMRoleUsername,
                noSDMRoleUserPassword: $noSDMRoleUserPassword,
                clientIDMT: $clientIDMT,
                clientSecretMT: $clientSecretMT,
                appUrlMT: $appUrlMT,
                authUrlMTSDC: $authUrlMTSDC,
                authUrlMTGWC: $authUrlMTGWC
              }' > "$JSON_FILE"
          )
          
          echo "Generated credentials.json (with masked secrets):"
          cat "$JSON_FILE" | jq '{ appUrlMT }'
          
          npm install
          
          echo ""
          echo "📋 Running Multi-Tenant Draft-enabled Entity(Books) Integration Tests (Tenant 1)..."
          TENANCY_MODEL=multi TENANT=SDM-DEV-CONSUMER-EU12 npm run integration-test

          echo ""
          echo "📋 Running Multi-Tenant Non-draft Entity(Projects) Integration Tests (Tenant 1)..."
          TENANCY_MODEL=multi TENANT=SDM-DEV-CONSUMER-EU12 npm run integration-test-non-draft
          
          echo ""
          echo "📋 Running Multi-Tenant Draft-enabled Entity(Books) Integration Tests (Tenant 2)..."
          TENANCY_MODEL=multi TENANT=SDMGoogleWorkspaceConsumer npm run integration-test

          echo ""
          echo "📋 Running Multi-Tenant Non-draft Entity(Projects) Integration Tests (Tenant 2)..."
          TENANCY_MODEL=multi TENANT=SDMGoogleWorkspaceConsumer npm run integration-test-non-draft
          
          echo ""
          echo "📋 Running Technical user Multi-Tenant Draft-enabled Entity(Books) Integration Tests (Tenant 1)..."
            TOKEN_FLOW=technicalUser TENANCY_MODEL=multi TENANT=SDM-DEV-CONSUMER-EU12 npm run integration-test
  
          echo ""
          echo "📋 Running Technical user Multi-Tenant Non-draft Entity(Projects) Integration Tests (Tenant 1)..."
            TOKEN_FLOW=technicalUser TENANCY_MODEL=multi TENANT=SDM-DEV-CONSUMER-EU12 npm run integration-test-non-draft
          
          echo ""
          echo "📋 Running Technical user Multi-Tenant Draft-enabled Entity(Books) Integration Tests (Tenant 2)..."
            TOKEN_FLOW=technicalUser TENANCY_MODEL=multi TENANT=SDMGoogleWorkspaceConsumer npm run integration-test

          echo ""
          echo "📋 Running Technical user Multi-Tenant Non-draft Entity(Projects) Integration Tests (Tenant 2)..."
            TOKEN_FLOW=technicalUser TENANCY_MODEL=multi TENANT=SDMGoogleWorkspaceConsumer npm run integration-test-non-draft
          
         
          
          echo "✅ All integration tests completed!"
