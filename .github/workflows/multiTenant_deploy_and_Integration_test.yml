name: Multi Tenancy Deploy and Integration Test

on:
  pull_request:
    types: [closed]
    branches:
      - develop
  workflow_dispatch:

permissions:
  pull-requests: read

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:        
      - name: Use Node.js 20.x
        uses: actions/setup-node@v6.2.0
        with:
          node-version: 20.x  
          
      - name: Login to Cloud Foundry
        run: |
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key \
          | sudo tee /etc/apt/trusted.gpg.d/cloudfoundry.asc
          echo "deb https://packages.cloudfoundry.org/debian stable main" \
          | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt update
          sudo apt install cf-cli
          cf login -a ${{ secrets.CF_API }} -u ${{ secrets.CF_USER }} -p ${{ secrets.CF_PASSWORD }} -o ${{ secrets.CF_ORG }} -s ${{ secrets.CF_SPACE }}
       
      - name: Clone and prepare projects & Build and deploy
        env:
          USERNAME: ${{ secrets.GH_USER_CAP_JS_INCIDENT_APP_MULTITENANCY }} # Add this secret with your GitHub username if needed
          TOKEN: ${{ secrets.GH_TOKEN_CAP_JS_INCIDENT_APP_MULTITENANCY }}
        run: |
          git clone --single-branch --branch develop https://github.com/cap-js/sdm.git
          git clone --single-branch --branch sdm-mtx-develop https://$USERNAME:$TOKEN@github.tools.sap/I324829/cap-js-incidents-app.git
          cd sdm
          npm pack
          echo "Current directory"
          pwd
          ls
          mv *.tgz ../cap-js-incidents-app
          cd ../cap-js-incidents-app
          npm i *.tgz
      
      - name: Build and deploy
        run: |
          cd cap-js-incidents-app
          wget -P /tmp https://github.com/SAP/cloud-mta-build-tool/releases/download/v1.2.28/cloud-mta-build-tool_1.2.28_Linux_amd64.tar.gz
          tar -xvzf /tmp/cloud-mta-build-tool_1.2.28_Linux_amd64.tar.gz
          sudo mv mbt /usr/local/bin/
          npm i @sap/cds-dk -g
          mbt build
          cf install-plugin multiapps -f
          cf deploy mta_archives/capire.incidents.mtx_0.0.3.mtar -f

  integration-test:
    runs-on: ubuntu-latest
    needs: deploy
    steps:
      - name: Checkout repository ✅
        uses: actions/checkout@v2

      - name: Setup Node.js environment ⚙️
        uses: actions/setup-node@v6.2.0
        with:
          node-version: '20'

      - name: Install Cloud Foundry CLI and jq 📦
        run: |
          echo "🔧 Installing Cloud Foundry CLI and jq..."
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install cf8-cli jq

      - name: Login to Cloud Foundry 🔑
        run: |
          echo "🔄 Logging in to Cloud Foundry..."
          cf login -a ${{ secrets.CF_API }} \
            -u ${{ secrets.CF_USER }} \
            -p ${{ secrets.CF_PASSWORD }} \
            -o ${{ secrets.CF_ORG }} \
            -s ${{ secrets.CF_SPACE }}

      - name: Fetch Multi Tenant Credentials 🔍
        id: fetch_credentials_mt
        run: |
          echo "Fetching client details for multi tenant..."
          service_instance_guid_mt=$(cf service incidents-mtx-auth --guid 2>/dev/null || echo "")
          
          if [ -z "$service_instance_guid_mt" ]; then
            echo "Warning: incidents-mtx-auth service not found, trying alternative service names..."
            service_instance_guid_mt=$(cf service sdm-incidents-mtx-auth --guid 2>/dev/null || echo "")
          fi
          
          if [ -z "$service_instance_guid_mt" ]; then
            echo "❌ Error: Unable to retrieve multitenant service instance GUID"; exit 1;
          fi
          
          bindings_response_mt=$(cf curl "/v3/service_credential_bindings?service_instance_guids=${service_instance_guid_mt}")
          binding_guid_mt=$(echo $bindings_response_mt | jq -r '.resources[0].guid')
          
          if [ -z "$binding_guid_mt" ] || [ "$binding_guid_mt" == "null" ]; then
            echo "❌ Error: Unable to retrieve multitenant binding GUID"; exit 1;
          fi
          
          binding_details_mt=$(cf curl "/v3/service_credential_bindings/${binding_guid_mt}/details")
          
          clientSecretMT=$(echo "$binding_details_mt" | jq -r '.credentials.clientsecret')
          clientIDMT=$(echo "$binding_details_mt" | jq -r '.credentials.clientid')
          
          if [ -z "$clientSecretMT" ] || [ "$clientSecretMT" == "null" ] || [ -z "$clientIDMT" ] || [ "$clientIDMT" == "null" ]; then
            echo "❌ Error: Invalid MT credentials from service"; exit 1;
          fi
          
          escapedClientSecretMT=$(echo "$clientSecretMT" | sed 's/\$/\\$/g')
          echo "CLIENT_SECRET_MT=${escapedClientSecretMT}" >> $GITHUB_ENV
          echo "CLIENT_ID_MT=${clientIDMT}" >> $GITHUB_ENV
          echo "✅ Multi-tenant client details fetched successfully!"

      - name: Run Integration Tests 🎯
        run: |
          echo "🚀 Starting multi-tenant integration tests..."
          
          JSON_FILE="test/integration/credentials.json"
          
          appUrlMT="${{ secrets.CF_ORG }}-${{ secrets.CF_SPACE }}-incidents-mtx-srv.cfapps.eu12.hana.ondemand.com"
          
          cat > "$JSON_FILE" <<EOL
          {
            "username": "${{ secrets.CF_USER }}",
            "password": "${{ secrets.CF_PASSWORD }}",
            "noSDMRoleUsername": "${{ secrets.NOSDMROLEUSERNAME }}",
            "noSDMRoleUserPassword": "${{ secrets.NOSDMROLEUSERPASSWORD }}",
            "clientIDMT": "${{ env.CLIENT_ID_MT }}",
            "clientSecretMT": "${{ env.CLIENT_SECRET_MT }}",
            "appUrlMT": "$appUrlMT",
            "authUrlMTSDC": "${{ secrets.AUTHURLMT1 }}",
            "authUrlMTGWC": "${{ secrets.AUTHURLMT2 }}"
          }
          EOL
          
          echo "Generated credentials.json (with masked secrets):"
          cat "$JSON_FILE" | jq 'del(.password, .clientSecretMT, .noSDMRoleUserPassword)'
          
          npm install
          
          echo ""
          echo "📋 Running Multi-Tenant Integration Tests (Tenant 1)..."
          TENANCY_MODEL=multi TENANT=SDM-DEV-CONSUMER-EU12 npm run integration-test
          
          echo ""
          echo "📋 Running Multi-Tenant Integration Tests (Tenant 2)..."
          TENANCY_MODEL=multi TENANT=SDMGoogleWorkspaceConsumer npm run integration-test
          
          echo "✅ All integration tests completed!"
