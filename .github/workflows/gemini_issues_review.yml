name: Gemini AI Issue Summarizer

on:
  # This workflow now triggers when a new issue is opened
  issues:
    types: [opened]

jobs:
  summarize:
    # Only run for org owners, members, and repo collaborators to prevent
    # external users from triggering AI analysis of repository content.
    if: |
      github.event.issue.author_association == 'OWNER' ||
      github.event.issue.author_association == 'MEMBER' ||
      github.event.issue.author_association == 'COLLABORATOR'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @actions/github @google/generative-ai @octokit/core

      - name: Run Gemini Issue Summarizer Script
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node .github/scripts/review.js
