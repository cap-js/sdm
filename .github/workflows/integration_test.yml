name: Integration Test

on:
  workflow_dispatch:
    inputs:
      cf_space:
        description: 'Specify the Cloud Foundry space to run integration tests on'
        required: true

permissions:
  pull-requests: read

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup Node.js environment
        uses: actions/setup-node@v2.1.5
        with:
          node-version: '20'

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Install Cloud Foundry CLI
        run: |
          # Use the direct download URL for CF CLI
          echo "Installing CF CLI..."
          
          # Get the latest version and download directly from GitHub releases
          CF_VERSION=$(curl -s https://api.github.com/repos/cloudfoundry/cli/releases/latest | grep -o '"tag_name": "v[^"]*"' | cut -d'"' -f4 | sed 's/v//')
          echo "Latest CF CLI version: $CF_VERSION"
          
          # Download the Linux binary directly using the correct URL format
          curl -L "https://github.com/cloudfoundry/cli/releases/download/v${CF_VERSION}/cf8-cli_${CF_VERSION}_linux_x86-64.tgz" -o cf-cli.tgz
          
          # Check if download was successful
          if [ ! -f cf-cli.tgz ]; then
            echo "Failed to download CF CLI"
            exit 1
          fi
          
          # Check if the file is actually a gzip file
          if ! file cf-cli.tgz | grep -q "gzip"; then
            echo "Downloaded file is not a valid gzip archive"
            file cf-cli.tgz
            exit 1
          fi
          
          # Extract and install
          tar -xzf cf-cli.tgz
          
          # Install the cf8 binary (the archive contains both cf and cf8, where cf is a symlink to cf8)
          sudo mv cf8 /usr/local/bin/cf
          sudo chmod +x /usr/local/bin/cf
          
          # Verify installation
          echo "Verifying CF CLI installation..."
          cf version

      - name: Determine Cloud Foundry Space
        id: determine_space
        run: |
          if [ "${{ github.event.inputs.cf_space }}" == "developcap" ]; then
            space="${{ secrets.CF_SPACE }}"
          else
            space="${{ github.event.inputs.cf_space }}"
          fi
          echo "Space determined for use"
          echo "space=$space" >> $GITHUB_ENV

      - name: Login to Cloud Foundry
        run: |
          echo "Org Name: ${{ secrets.CF_ORG }}"
          # Do not log space name to avoid unintended exposure
          cf login -a ${{ secrets.CF_API }} \
            -u ${{ secrets.CF_USER }} \
            -p ${{ secrets.CF_PASSWORD }} \
            -o ${{ secrets.CF_ORG }} \
            -s ${{ env.space }}

      - name: Fetch and Escape Client Secret
        id: fetch_secret
        run: |
          service_instance_guid=$(cf service sdm-incidents-auth --guid)
          if [ -z "$service_instance_guid" ]; then
            echo "Error: Unable to retrieve service instance GUID"; exit 1;
          fi
          
          bindings_response=$(cf curl "/v3/service_credential_bindings?service_instance_guids=${service_instance_guid}")
          binding_guid=$(echo $bindings_response | jq -r '.resources[0].guid')
          if [ -z "$binding_guid" ]; then
            echo "Error: Unable to retrieve binding GUID"; exit 1;
          fi
          
          binding_details=$(cf curl "/v3/service_credential_bindings/${binding_guid}/details")
          
          clientSecret=$(echo "$binding_details" | jq -r '.credentials.clientsecret')
          if [ -z "$clientSecret" ] || [ "$clientSecret" == "null" ]; then
            echo "Error: clientSecret is not set or is null"; exit 1;
          fi
          escapedClientSecret=$(echo "$clientSecret" | sed 's/\$/\\$/g')
          
          clientID=$(echo "$binding_details" | jq -r '.credentials.clientid')
          if [ -z "$clientID" ] || [ "$clientID" == "null" ]; then
            echo "Error: clientID is not set or is null"; exit 1;
          fi
          
          echo "CLIENT_SECRET=${escapedClientSecret}" >> $GITHUB_ENV || echo "CLIENT_SECRET=REDACTED" >> $GITHUB_ENV
          echo "CLIENT_ID=${clientID}" >> $GITHUB_ENV || echo "CLIENT_ID=REDACTED" >> $GITHUB_ENV

      - name: Run integration tests
        run: |
          appUrl="${{ secrets.CF_ORG }}-${{ env.space }}-incidents-srv.cfapps.eu12.hana.ondemand.com"
          echo "app url: ${appUrl}"
          # JSON file path
          JSON_FILE="test/integration/credentials.json"
          # Modify JSON file
          jq --arg appUrl "$appUrl" --arg authUrl "${{ secrets.CAPAUTH_URL }}" --arg clientID "${{ env.CLIENT_ID }}" --arg clientSecret "${{ env.CLIENT_SECRET }}" --arg username "${{ secrets.CF_USER }}" --arg password "${{ secrets.CF_PASSWORD }}" --arg nosdmroleusername "${{ secrets.NOSDMROLEUSERNAME }}" --arg nosdmrolepassword "${{ secrets.NOSDMROLEUSERPASSWORD }}" \
          '.appUrl = $appUrl | .authUrl = $authUrl | .clientID = $clientID | .clientSecret = $clientSecret | .username = $username | .password = $password | .noSDMRoleUsername = $nosdmroleusername | .noSDMRoleUserPassword = $nosdmrolepassword' $JSON_FILE > "temp.json" \
          && mv "temp.json" $JSON_FILE
          # Redact sensitive fields before printing
          jq '{ appUrl, authUrl, username, password }' $JSON_FILE | sed 's/"clientID": "[^"]*"/"clientID": "***"/' | sed 's/"clientSecret": "[^"]*"/"clientSecret": "***"/'
          npm install
          npm run integration-test
