name: Integration Test

on:
  push:
    branches: ["MultitenantIntegrationTest"]
  workflow_dispatch:
    inputs:
      cf_space:
        description: 'Specify the Cloud Foundry space to run integration tests on'
        required: false
        default: Deepika

      branch_name:
        description: 'Specify the branch to use for integration tests'
        required: false
        default: MultitenantIntegrationTest

permissions:
  pull-requests: read

jobs:
  integration-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2
        with:
          ref: ${{ github.event.inputs.branch_name || github.ref }}

      - name: Setup Node.js environment 
        uses: actions/setup-node@v2.1.5
        with:
          node-version: '20'

      - name: Install Cloud Foundry CLI and jq 
        run: |
          echo "🔧 Installing Cloud Foundry CLI and jq..."
          wget -q -O - https://packages.cloudfoundry.org/debian/cli.cloudfoundry.org.key | sudo apt-key add -
          echo "deb https://packages.cloudfoundry.org/debian stable main" | sudo tee /etc/apt/sources.list.d/cloudfoundry-cli.list
          sudo apt-get update
          sudo apt-get install cf8-cli jq

      - name: Determine Cloud Foundry Space 
        id: determine_space
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            # For push events to MultitenantIntegrationTest branch, use Deepika space
            space="Deepika"
          elif [ "${{ github.event.inputs.cf_space }}" == "developcap" ]; then
            space="${{ secrets.CF_SPACE }}"
          elif [ -n "${{ github.event.inputs.cf_space }}" ]; then
            space="${{ github.event.inputs.cf_space }}"
          else
            space="Deepika"
          fi
          echo "Space determined for use: $space"
          echo "space=$space" >> $GITHUB_ENV

      - name: Login to Cloud Foundry
        run: |
          echo "Logging in to Cloud Foundry..."
          cf login -a ${{ secrets.CF_API }} \
            -u ${{ secrets.CF_USER }} \
            -p ${{ secrets.CF_PASSWORD }} \
            -o ${{ secrets.CF_ORG }} \
            -s ${{ env.space }}

      - name: Fetch Single Tenant Credentials 
        id: fetch_credentials_single
        run: |
          echo "Fetching client details for single tenant..."
          service_instance_guid=$(cf service sdm-incidents-auth --guid 2>/dev/null || echo "")
          
          if [ -z "$service_instance_guid" ]; then
            echo " Warning: sdm-incidents-auth service not found, trying alternative service names..."
            service_instance_guid=$(cf service incidents-auth --guid 2>/dev/null || echo "")
          fi
          
          if [ -z "$service_instance_guid" ]; then
            echo " Error: Unable to retrieve single tenant service instance GUID"; exit 1;
          fi
          
          bindings_response=$(cf curl "/v3/service_credential_bindings?service_instance_guids=${service_instance_guid}")
          binding_guid=$(echo $bindings_response | jq -r '.resources[0].guid')
          
          if [ -z "$binding_guid" ] || [ "$binding_guid" == "null" ]; then
            echo " Error: Unable to retrieve single tenant binding GUID"; exit 1;
          fi
          
          binding_details=$(cf curl "/v3/service_credential_bindings/${binding_guid}/details")
          
          clientSecret=$(echo "$binding_details" | jq -r '.credentials.clientsecret')
          clientID=$(echo "$binding_details" | jq -r '.credentials.clientid')
          
          if [ -z "$clientSecret" ] || [ "$clientSecret" == "null" ] || [ -z "$clientID" ] || [ "$clientID" == "null" ]; then
            echo " Error: Invalid single tenant credentials from service"; exit 1;
          fi
          
          escapedClientSecret=$(echo "$clientSecret" | sed 's/\$/\\$/g')
          echo "CLIENT_SECRET=${escapedClientSecret}" >> $GITHUB_ENV
          echo "CLIENT_ID=${clientID}" >> $GITHUB_ENV
          echo "Single-tenant client details fetched successfully!"

      - name: Fetch Multi Tenant Credentials 
        id: fetch_credentials_mt
        run: |
          echo "Fetching client details for multi tenant..."
          service_instance_guid_mt=$(cf service incidents-mtx-auth --guid 2>/dev/null || echo "")
          
          if [ -z "$service_instance_guid_mt" ]; then
            echo "Warning: incidents-mtx-auth service not found, trying alternative service names..."
            service_instance_guid_mt=$(cf service sdm-incidents-mtx-auth --guid 2>/dev/null || echo "")
          fi
          
          if [ -z "$service_instance_guid_mt" ]; then
            echo " Error: Unable to retrieve multitenant service instance GUID"; exit 1;
          fi
          
          bindings_response_mt=$(cf curl "/v3/service_credential_bindings?service_instance_guids=${service_instance_guid_mt}")
          binding_guid_mt=$(echo $bindings_response_mt | jq -r '.resources[0].guid')
          
          if [ -z "$binding_guid_mt" ] || [ "$binding_guid_mt" == "null" ]; then
            echo " Error: Unable to retrieve multitenant binding GUID"; exit 1;
          fi
          
          binding_details_mt=$(cf curl "/v3/service_credential_bindings/${binding_guid_mt}/details")
          
          clientSecretMT=$(echo "$binding_details_mt" | jq -r '.credentials.clientsecret')
          clientIDMT=$(echo "$binding_details_mt" | jq -r '.credentials.clientid')
          
          if [ -z "$clientSecretMT" ] || [ "$clientSecretMT" == "null" ] || [ -z "$clientIDMT" ] || [ "$clientIDMT" == "null" ]; then
            echo " Error: Invalid MT credentials from service"; exit 1;
          fi
          
          escapedClientSecretMT=$(echo "$clientSecretMT" | sed 's/\$/\\$/g')
          echo "CLIENT_SECRET_MT=${escapedClientSecretMT}" >> $GITHUB_ENV
          echo "CLIENT_ID_MT=${clientIDMT}" >> $GITHUB_ENV
          echo " Multi-tenant client details fetched successfully!"

      - name: Run Integration Tests 
        run: |
          echo " Starting integration tests..."
          
          JSON_FILE="test/integration/credentials.json"
          
          # Single tenant app URL
          appUrl="${{ secrets.CF_ORG }}-${{ env.space }}-incidents-srv.cfapps.eu12.hana.ondemand.com"
          
          # Multi tenant app URL
          appUrlMT="${{ secrets.CF_ORG }}-${{ env.space }}-incidents-mtx-srv.cfapps.eu12.hana.ondemand.com"
          
          # Generate credentials.json with both single and multi-tenant credentials
          cat > "$JSON_FILE" <<EOL
          {
            "username": "${{ secrets.CF_USER }}",
            "password": "${{ secrets.CF_PASSWORD }}",
            "noSDMRoleUsername": "${{ secrets.NOSDMROLEUSERNAME }}",
            "noSDMRoleUserPassword": "${{ secrets.NOSDMROLEUSERPASSWORD }}",
            "appUrl": "$appUrl",
            "authUrl": "${{ secrets.CAPAUTH_URL }}",
            "clientID": "${{ env.CLIENT_ID }}",
            "clientSecret": "${{ env.CLIENT_SECRET }}",
            "clientIDMT": "${{ env.CLIENT_ID_MT }}",
            "clientSecretMT": "${{ env.CLIENT_SECRET_MT }}",
            "appUrlMT": "$appUrlMT",
            "authUrlMTSDC": "${{ secrets.AUTHURLMT1 }}",
            "authUrlMTGWC": "${{ secrets.AUTHURLMT2 }}"
          }
          EOL
          
          echo " Generated credentials.json (with masked secrets):"
          cat "$JSON_FILE" | jq 'del(.password, .clientSecret, .clientSecretMT, .noSDMRoleUserPassword)'
          
          echo ""
          echo " Installing dependencies..."
          npm install
          
          echo ""
          echo "========================================"
          echo " Running Single Tenant Integration Tests..."
          echo "========================================"
          TENANCY_MODEL=single npm run integration-test
          
          echo ""
          echo "========================================"
          echo " Running Multi-Tenant Integration Tests (Tenant 1)..."
          echo "========================================"
          TENANCY_MODEL=multi TENANT=TENANT1 npm run integration-test
          
          echo ""
          echo "========================================"
          echo " Running Multi-Tenant Integration Tests (Tenant 2)..."
          echo "========================================"
          TENANCY_MODEL=multi TENANT=TENANT2 npm run integration-test
          
          echo ""
          echo " All integration tests completed successfully!"